<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portafolio de fotografía profesional en LuxArs">
    <title>Portafolio | LuxArs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/portfolio.css">
</head>
<body>
    <header class="navbar">
        <div class="navbar-container">
            <a class="navbar-brand" href="index.html" aria-label="LuxArs, inicio">
                <svg class="logo" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <circle cx="20" cy="20" r="18" fill="none" stroke="#E60D0D" stroke-width="2"/>
                    <circle cx="20" cy="18" r="5" fill="#E60D0D"/>
                    <circle cx="28" cy="28" r="3" fill="#E60D0D"/>
                </svg>
                <span class="brand-text">LuxArs</span>
            </a>
            <a href="index.html#galeria" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Volver a portafolios</a>
        </div>
    </header>

    <main class="portfolio-page">
        <section class="portfolio-profile" aria-labelledby="portfolio-name">
            <div class="portfolio-profile-header">
                <div class="portfolio-avatar" id="portfolio-avatar" aria-hidden="true"></div>
                <div>
                    <span class="portfolio-kicker"><i class="bi bi-patch-check-fill"></i> Fotógrafo verificado</span>
                    <h1 id="portfolio-name">Portafolio profesional</h1>
                    <p id="portfolio-specialty"></p>
                    <p class="portfolio-location"><i class="bi bi-geo-alt-fill"></i> Disponible para proyectos en tu ciudad</p>
                </div>
            </div>
            <div class="portfolio-actions">
                <a href="search-photographer.html" class="btn btn-primary"><i class="bi bi-calendar-check"></i> Solicitar disponibilidad</a>
                <a href="register.html" class="btn btn-secondary"><i class="bi bi-person-plus"></i> Crear cuenta</a>
            </div>
        </section>

        <section class="portfolio-work" aria-labelledby="work-title">
            <div class="portfolio-section-heading">
                <span class="portfolio-kicker">Selección de trabajos</span>
                <h2 id="work-title">Historias capturadas con intención</h2>
            </div>
            <div class="portfolio-gallery" id="portfolio-gallery"></div>
        </section>
    </main>

    <script src="assets/js/portfolio.js"></script>
</body>
</html>
